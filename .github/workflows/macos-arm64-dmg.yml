name: macOS ARM64 DMG

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build optimized Apple Silicon DMG on macOS 26
    runs-on: macos-26
    timeout-minutes: 45

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"

    steps:
      - name: Check out source and submodules
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify macOS 26 ARM64 runner
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "arm64"
          macos_version="$(sw_vers -productVersion)"
          test "${macos_version%%.*}" = "26"

          echo "Building on macOS ${macos_version} ($(uname -m))"
          xcodebuild -version
          cmake --version

      - name: Install build and SDR dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install \
            cmake \
            ninja \
            pkgconf \
            wxwidgets@3.2 \
            liquid-dsp \
            soapysdr \
            hamlib \
            libusb \
            hackrf \
            airspy \
            airspyhf \
            libbladerf \
            librtlsdr \
            soapyrtlsdr

      - name: Build and install Soapy device modules
        shell: bash
        run: |
          set -euo pipefail

          build_soapy_module() {
            local name="$1"
            local repository="$2"
            local revision="$3"
            local checksum="$4"
            local archive="${RUNNER_TEMP}/${name}.tar.gz"
            local source_dir="${RUNNER_TEMP}/${name}-source"
            local build_dir="${RUNNER_TEMP}/${name}-build"

            curl --fail --location --retry 3 \
              --output "$archive" \
              "https://github.com/pothosware/${repository}/archive/${revision}.tar.gz"
            echo "${checksum}  ${archive}" | shasum -a 256 --check

            mkdir -p "$source_dir"
            tar -xzf "$archive" --strip-components=1 -C "$source_dir"

            cmake -S "$source_dir" -B "$build_dir" -G Ninja \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$(brew --prefix)" \
              -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
            cmake --build "$build_dir" --parallel "$(sysctl -n hw.logicalcpu)"
            cmake --install "$build_dir"
          }

          # Match the open-source Soapy modules used by the local macOS build.
          # Each archive is pinned by both commit and SHA-256. SoapyIris is no
          # longer publicly available at its original source, and SDRplay needs
          # the proprietary sdrplay_api SDK, so neither can be built in CI.
          build_soapy_module \
            soapyremote SoapyRemote \
            f920d9bf10f62f67c8e31b7dc25090bc784e5210 \
            bdd836e8880ae4face6e29416ff0b75cf1048a998bb6d6b360c37c3df4c7cd76
          build_soapy_module \
            soapyaudio SoapyAudio \
            2ae84e32a72524701789df6d0a511ab484aa0897 \
            8da09104e58481b616268920e12243935c443e22cf70b9d3c95020206729fda2
          build_soapy_module \
            soapyhackrf SoapyHackRF \
            79077f0425f732954c1d74dbbacd788b0ac7d733 \
            227ec4e91754daac4a12ce727c98f494c64d9e45c71e1aa6bf43aeffcbf44b08
          build_soapy_module \
            soapyairspy SoapyAirspy \
            411f73e16532cf6c0fe40209b83e7115ad43c108 \
            be17d6468ed81031aab8f81e1f3fdcf50a4fe8469a9a18b68ab214c1da03af3c
          build_soapy_module \
            soapyairspyhf SoapyAirspyHF \
            d6825331a6bfc3578dc6fe5091fce3d550b6af3c \
            83f93c30f37277c1acc910fb37978e20378bcbcf53e399a190a2d45d908eb535
          build_soapy_module \
            soapybladerf SoapyBladeRF \
            1c1e8aaba5e8ee154b34c6c3b17743d1c9b9a1ea \
            59347b5b6032c2d61f7cbcecc9baf4754e8abb46cf88b10a3995b8769c161afc
          build_soapy_module \
            soapyredpitaya SoapyRedPitaya \
            3d576f83b3bde52104b2a88150516ca8c9a78c7a \
            6fff6293f7f23130c4ead6975f48396de50d7b769bfacfe75e6a48619c4585da

          SoapySDRUtil --check=remote
          SoapySDRUtil --check=rtlsdr
          SoapySDRUtil --check=audio
          SoapySDRUtil --check=hackrf
          SoapySDRUtil --check=airspy
          SoapySDRUtil --check=airspyhf
          SoapySDRUtil --check=bladerf
          SoapySDRUtil --check=redpitaya

      - name: Build optimized CubicSDR bundle
        shell: bash
        run: |
          set -euo pipefail

          # Homebrew is /opt/homebrew on hosted Apple Silicon runners. Resolve
          # wx-config dynamically so this also works on a self-hosted ARM Mac.
          export WX_CONFIG="$(brew --prefix wxwidgets@3.2)/bin/wx-config-3.2"

          ./build.sh --clean -- \
            -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_POLICY_DEFAULT_CMP0069=NEW \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -mcpu=apple-m1" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -mcpu=apple-m1" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,-dead_strip"

      - name: Verify ARM64 application bundle
        shell: bash
        run: |
          set -euo pipefail

          app="${GITHUB_WORKSPACE}/build-clean/dist/CubicSDR.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"

          for module in \
            libremoteSupport.so \
            librtlsdrSupport.so \
            libaudioSupport.so \
            libHackRFSupport.so \
            libairspySupport.so \
            libairspyhfSupport.so \
            libbladeRFSupport.so \
            libRedPitaya.so; do
            test -f "$app/Contents/MacOS/modules/$module" || {
              echo "Missing bundled SoapySDR module: $module" >&2
              exit 1
            }
          done

          microphone_usage="$(/usr/libexec/PlistBuddy -c \
            'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist")"
          test -n "$microphone_usage"

          while IFS= read -r candidate; do
            if file "$candidate" | grep -q "Mach-O"; then
              architectures="$(lipo -archs "$candidate")"
              if [[ "$architectures" != "arm64" ]]; then
                echo "Non-ARM64 Mach-O file: $candidate ($architectures)" >&2
                exit 1
              fi
            fi
          done < <(find "$app" -type f -print)

      - name: Create compressed DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail

          app="${GITHUB_WORKSPACE}/build-clean/dist/CubicSDR.app"
          staging="${RUNNER_TEMP}/CubicSDR-dmg"
          output_dir="${GITHUB_WORKSPACE}/build-clean/artifacts"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")"
          dmg_name="CubicSDR-${version}-macOS-arm64.dmg"
          dmg_path="${output_dir}/${dmg_name}"

          mkdir -p "$staging" "$output_dir"
          ditto "$app" "$staging/CubicSDR.app"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "CubicSDR ${version}" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$dmg_path"
          hdiutil verify "$dmg_path"
          shasum -a 256 "$dmg_path"

          echo "name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CubicSDR-macOS-arm64-DMG
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          archive: false
          retention-days: 14
